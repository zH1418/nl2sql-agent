[project]
name = "nl2sql-agent"
version = "1.0.0"
description = "NL2SQL Agent: schema recall -> word selection -> program-built SQL (SQLGlot AST) -> execution, orchestrated as a single create_agent loop"
requires-python = ">=3.11"
dependencies = [
    "asyncmy==0.2.11",
    "elasticsearch[async]>=8,<9",
    "fastapi[standard]==0.128.0",
    "jieba==0.42.1",
    "langchain>=1.3.11",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.0.0",
    "langgraph>=1.2.5",
    "loguru==0.7.3",
    "numpy>=1.26.0",
    "omegaconf==2.3.0",
    "onnxruntime>=1.30.0",
    "pyyaml==6.0.3",
    "qdrant-client==1.16.2",
    "requests>=2.34.2",
    "sqlalchemy==2.0.46",
    "sqlglot>=30.17.0",
    "tokenizers>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# 让 tests/ 能 import app.*（无需手动设 PYTHONPATH）
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
# 离线单测：不需要 LLM / 数据库 / 网络
markers = [
    "online: 需要真实 LLM / 数据库（默认不跑）",
]
